# Plaintext template. Copy to secrets.yaml, fill in real values, then encrypt:
#
#   cp secrets.example.yaml secrets.yaml
#   $EDITOR secrets.yaml          # paste real credentials
#   sops -e secrets.yaml > secrets.enc.yaml
#   rm secrets.yaml               # NEVER commit plaintext (also covered by .gitignore)
#
# After that, day-to-day edits go through `sops secrets.enc.yaml` which
# decrypts in $EDITOR and re-encrypts on save. The plaintext copy stays in
# memory only.
s3:
  key: REPLACE_ME
  secret: REPLACE_ME
